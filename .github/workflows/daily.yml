name: にじトラッカー登録者数取得
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,12 * * *' # JST 09:17, 21:17 (GitHubの実行遅延あり)
permissions:
  contents: write
concurrency:
  group: nijitracker-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: データを取得する
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_subscribers.py
      - name: 記録を保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/latest.json data/intraday/
          if ! git diff --cached --quiet; then
            git commit -m "Record subscriber snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
