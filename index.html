<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f7fb"><meta name="description" content="にじさんじのYouTube登録者数を記録する非公式アプリ">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-180.png"><link rel="icon" href="assets/icon-192.png"><link rel="stylesheet" href="style.css?v=20261109-2">
<title>にじトラッカー</title></head><body>
<div class="shell">
 <header class="top"><div class="brand"><img src="assets/icon-192.png" class="brand-icon" alt=""><div><small>NIJI TRACKER · 非公式</small><h1>にじトラッカー</h1></div></div><button id="themeToggle" class="theme-btn" aria-label="表示テーマを切り替え">◐</button></header>
 <main>
  <section id="summary" class="panel summary"><div class="summary-head"><span>登録者数データ</span><span id="health">確認中</span></div><div class="stats"><div><small>対象チャンネル</small><strong id="memberCount">—</strong></div><div><small>最終取得</small><strong id="updatedTime">—</strong></div><div><small>取得状況</small><strong id="trackedCount">—</strong></div></div><p id="timeDetail" class="mini">データ読み込み中</p></section>
  <div id="notice" class="notice" hidden role="status"></div>
  <div id="homeView">
   <div class="segment main-segment" role="group" aria-label="表示ページ"><button data-tab="ranking" class="chosen">ランキング</button><button data-tab="changed">今日の変動</button></div>
   <div id="periodControls" class="segment period" role="group" aria-label="比較期間"><button data-period="total" class="chosen">総数</button><button data-period="day">前日比</button><button data-period="week">7日</button><button data-period="month">30日</button></div>
   <div id="changeSummary" hidden><div class="change-stats"><div class="panel"><small>増加</small><strong id="gainers">—</strong></div><div class="panel"><small>減少</small><strong id="losers">—</strong></div></div><p id="comparisonLabel" class="mini"></p></div>
   <label class="search-box"><span>⌕</span><input id="search" type="search" autocomplete="off" placeholder="ライバー名・読み仮名・英語名で検索"></label>
   <div class="filter-row"><select id="category"><option value="liver">ライバー</option><option value="group">公式・ユニット</option><option value="all">すべて</option></select><select id="region"><option value="all">全所属</option><option value="JP">JP</option><option value="EN">EN</option><option value="KR">旧KR</option><option value="ID">旧ID</option></select><select id="sort"><option value="desc">多い順</option><option value="asc">少ない順</option><option value="abs">変動幅順</option></select></div>
   <div class="section-title"><h2 id="listTitle">登録者数ランキング</h2><small id="resultCount">—</small></div>
   <div id="ranking" class="results"></div>
  </div>
  <div id="detailView" hidden><button id="back" class="back-btn">← ランキングに戻る</button><div id="detailContent"></div></div>
  <section class="footnote"><strong>データについて</strong><p>YouTube Data APIの公開登録者数は有効数字3桁に切り捨てられます。比較に必要な記録がない場合は「データ不足」と表示します。取得の失敗や遅延が発生することがあります。</p><p>本アプリは非公式の個人制作物で、ANYCOLOR株式会社・YouTubeの公式サービスではありません。</p></section>
 </main><footer>NIJI TRACKER <span>Made for personal use</span></footer>
</div><script src="app.js?v=20261109-3" defer></script></body></html>
